# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter --version

      # Dependencies must be resolved before formatting: without the package
      # config, `dart format` cannot read the language version (which selects
      # the formatting style) nor the analysis_options include, and reports
      # nearly every file as changed.
      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: ./example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
