name: Create Tag from pubspec.yaml

on:
  push:
    branches:
      - main

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push tags

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Detected version: $VERSION"

      # A merge that leaves the version alone has nothing to release: the tag for that version is
      # already there. Failing here turned every ordinary pull request into a red run on main, which
      # is how a red X stops meaning anything — the one signal that has to stay truthful is the one
      # that says a change is not shippable.
      - name: Is this version already tagged?
        id: tagged
        env:
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin | grep -q "refs/tags/$VERSION$"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::$VERSION is already tagged, so this push does not change what ships. Bump version: in pubspec.yaml to release one."
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "🆕 $VERSION is not tagged yet."
          fi

      - name: Check if version exists in CHANGELOG.md
        if: steps.tagged.outputs.yes == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if ! grep -q "##\s*\[$VERSION\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md does not contain an entry for version [$VERSION]"
            echo "👉 Please add a changelog entry like: '## [$VERSION]'"
            exit 1
          fi
          echo "✅ Found changelog entry for [$VERSION]"

      - name: Create and push tag with gh + PAT
        if: steps.tagged.outputs.yes == 'false'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "🏷️ Creating tag: $VERSION"
          git tag "$VERSION"

          echo "⬆️ Pushing tag with gh CLI"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/git/refs \
            -f ref="refs/tags/$VERSION" \
            -f sha="$(git rev-parse HEAD)"

          echo "✅ Tag $VERSION pushed successfully!"
