name: phone_form_field
description: Flutter phone input integrated with flutter internationalization
version: 11.0.2
homepage: https://github.com/cedvdb/phone_form_field

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.18.0 <=1.0.0"
  flutter_country_selector: ^2.0.1
  circle_flags: ^5.0.1
  material_ui: ^1.0.0
  phone_numbers_parser: ^9.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  flutter_lints: ^6.0.0

flutter:
  generate: true
